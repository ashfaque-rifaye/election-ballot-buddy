# Election Assistant - Cloud Build Configuration
# Built with Google Antigravity & Vertex AI
#
# Builds the backend Docker image from the project root context.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/election-assistant-api:latest'
      - '-f'
      - 'server/Dockerfile'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/election-assistant-api:latest'
